[package]
name = "nerqon"
version = "1.0.0"
edition = "2021"
authors = ["NidhiTek <hello@nidhitek.com>"]
description = "Official Rust client for the Nerqon vector database"
license = "MIT"
repository = "https://github.com/nidhitek/nerqon-rust"
keywords = ["vector-database", "search", "embeddings", "ai"]
categories = ["database", "api-bindings"]

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
thiserror = "1"
