[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nerqon"
version = "1.1.0"
description = "Official Python SDK for Nerqon — Hybrid Vector + Graph Database"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "NidhiTek", email = "info@nidhitek.com"},
]
keywords = [
    "vector-database", "embeddings", "semantic-search", "rag",
    "knowledge-graph", "hybrid-search", "ai", "machine-learning",
    "Nerqon", "nidhitek",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "responses>=0.23",
]

[project.urls]
Homepage = "https://nidhitek.com"
Documentation = "https://nidhitek.com/documentation.html"
Repository = "https://github.com/nidhitek/Nerqon-python"
"Bug Tracker" = "https://github.com/nidhitek/Nerqon-python/issues"
Changelog = "https://github.com/nidhitek/Nerqon-python/releases"

[tool.setuptools.packages.find]
include = ["Nerqon*"]
